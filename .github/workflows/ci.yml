name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Every push to main gets a full result; only superseded PR runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: precommit:full (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CI: "true"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Linux system libraries (webkit2gtk, GTK 3)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: canary

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.3

      - run: bun install --frozen-lockfile

      # The Studio bundle must exist for tauri's build script (frontendDist).
      - run: bun run build

      - run: bun run precommit:full
