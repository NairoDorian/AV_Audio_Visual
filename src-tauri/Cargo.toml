[package]
name = "av-app"
description = "AV_AudioVisual composition root: startup order, tray, commands and the Studio window."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "av-app"

# A fixed structural library name, not derived from the product name, so a
# rename never has to chase `use` paths (ZER0 pattern).
[lib]
name = "av_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "av-app"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
av-protocol.workspace = true
av-dsp.workspace = true
av-audio.workspace = true
av-engine.workspace = true
av-render.workspace = true
av-platform.workspace = true

tauri.workspace = true
tauri-runtime-wry.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true



# Linux: wry's webview is webkit2gtk (GTK 3), so tauri needs its `gtk3` feature there. GTK 4 is a
# later decision (blueprint section 1.2, P1.5b).
[target.'cfg(target_os = "linux")'.dependencies]
tauri = { workspace = true, features = ["gtk3"] }

[lints]
workspace = true
